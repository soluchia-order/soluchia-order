<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Soluchia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@1,400;1,500;1,600&family=Shippori+Mincho+B1:wght@500;700&family=Noto+Sans+JP:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#F7F1E3;
  --surface:#FFFFFF;
  --surface-2:#1F4034;
  --surface-2-ink:#F7F1E3;
  --ink:#221D19;
  --ink-soft:#736A5E;
  --line:#E4DAC4;
  --accent:#C77D2E;
  --accent-ink:#FFFFFF;
  --success:#4C7A3D;
  --success-bg:#E7EFDF;
  --alert:#B4402A;
  --alert-bg:#F5E1DA;
  --info:#3E6E8E;
  --info-bg:#E1EBF0;
  --cooking-bg:#F3E5D0;
  --shadow-card:0 1px 2px rgba(34,29,25,.06), 0 10px 26px -14px rgba(34,29,25,.35);
  --shadow-pop:0 20px 60px -20px rgba(20,16,12,.45);
  --sp-1:4px;--sp-2:8px;--sp-3:12px;--sp-4:16px;--sp-5:24px;--sp-6:32px;--sp-7:48px;
  --r-sm:8px;--r-md:14px;--r-lg:22px;--r-pill:999px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#16130F;
    --surface:#221C16;
    --surface-2:#0F2A22;
    --surface-2-ink:#F1E9D8;
    --ink:#F1E9D8;
    --ink-soft:#B4A890;
    --line:#3A3225;
    --accent:#E0973C;
    --accent-ink:#1B1310;
    --success:#7FB566;
    --success-bg:#203327;
    --alert:#E08669;
    --alert-bg:#3B241E;
    --info:#7FBCDE;
    --info-bg:#1E313B;
    --cooking-bg:#3D2E17;
    --shadow-card:0 1px 2px rgba(0,0,0,.4), 0 10px 26px -14px rgba(0,0,0,.6);
    --shadow-pop:0 20px 60px -20px rgba(0,0,0,.8);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#16130F;
  --surface:#221C16;
  --surface-2:#0F2A22;
  --surface-2-ink:#F1E9D8;
  --ink:#F1E9D8;
  --ink-soft:#B4A890;
  --line:#3A3225;
  --accent:#E0973C;
  --accent-ink:#1B1310;
  --success:#7FB566;
  --success-bg:#203327;
  --alert:#E08669;
  --alert-bg:#3B241E;
  --info:#7FBCDE;
  --info-bg:#1E313B;
  --cooking-bg:#3D2E17;
  --shadow-card:0 1px 2px rgba(0,0,0,.4), 0 10px 26px -14px rgba(0,0,0,.6);
  --shadow-pop:0 20px 60px -20px rgba(0,0,0,.8);
  color-scheme:dark;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:"Noto Sans JP","Hiragino Kaku Gothic ProN",sans-serif;
  -webkit-font-smoothing:antialiased;
  min-height:100vh;
}
h1,h2,h3,h4{margin:0;text-wrap:balance;}
p{margin:0;}
button{font-family:inherit;}
input,select,textarea{font-family:inherit;}
::selection{background:var(--accent);color:var(--accent-ink);}
.jp-display{font-family:"Shippori Mincho B1",serif;}
.it-display{font-family:"Fraunces",serif;font-style:italic;}
.tabular{font-variant-numeric:tabular-nums;}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,[tabindex]:focus-visible{
  outline:2px solid var(--accent);outline-offset:2px;
}
@media (prefers-reduced-motion: reduce){
  *{animation-duration:.001ms !important;animation-iteration-count:1 !important;transition-duration:.001ms !important;}
}

#page{min-height:100vh;padding:var(--sp-6) var(--sp-4) var(--sp-7);position:relative;}

.phone{
  max-width:480px;margin:0 auto;background:var(--surface);border-radius:28px;
  box-shadow:var(--shadow-pop);border:1px solid var(--line);overflow:hidden;
  min-height:100vh;display:flex;flex-direction:column;position:relative;
}
@media (max-width:520px){
  #page{padding:0;}
  .phone{max-width:100%;border-radius:0;box-shadow:none;border:none;min-height:100vh;min-height:100dvh;}
}
.phone-head{
  background:var(--surface-2);color:var(--surface-2-ink);
  padding:var(--sp-5) var(--sp-4) var(--sp-4);
  display:flex;align-items:flex-start;justify-content:space-between;gap:var(--sp-3);
}
.brand-name{font-size:1.6rem;line-height:1.1;}
.brand-tag{font-size:.7rem;letter-spacing:.16em;text-transform:uppercase;opacity:.72;margin-top:4px;}
.table-chip{
  background:rgba(247,241,227,.14);border:1px solid rgba(247,241,227,.3);
  border-radius:var(--r-pill);padding:6px 12px;font-size:.75rem;font-weight:600;
  white-space:nowrap;cursor:pointer;color:inherit;
}
.table-chip:hover{background:rgba(247,241,227,.22);}

.cat-row{
  display:flex;gap:8px;overflow-x:auto;padding:12px var(--sp-4);
  background:var(--surface);border-bottom:1px solid var(--line);
  scrollbar-width:none;position:sticky;top:0;z-index:5;
}
.cat-row::-webkit-scrollbar{display:none;}
.cat-pill{
  flex:none;border:1px solid var(--line);background:var(--surface);color:var(--ink-soft);
  padding:7px 15px;border-radius:var(--r-pill);font-size:.8rem;font-weight:600;cursor:pointer;
}
.cat-pill.active{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);}

.menu-scroll{flex:1;overflow-y:auto;padding:var(--sp-4);padding-bottom:96px;}
.cat-heading{display:flex;align-items:baseline;gap:8px;margin:var(--sp-5) 0 var(--sp-3);}
.cat-heading:first-child{margin-top:0;}
.cat-heading .jp{font-family:"Shippori Mincho B1",serif;font-size:1.2rem;}
.cat-heading .it{font-size:.85rem;color:var(--ink-soft);}

.item-card{
  display:flex;gap:12px;padding:var(--sp-3) 0;border-bottom:1px solid var(--line);
}
.item-card:last-child{border-bottom:none;}
.item-emoji{
  flex:none;width:56px;height:56px;border-radius:var(--r-md);background:var(--bg);
  display:flex;align-items:center;justify-content:center;font-size:1.6rem;border:1px solid var(--line);
}
.item-body{flex:1;min-width:0;}
.item-name{font-weight:700;font-size:.95rem;}
.item-sub{font-size:.72rem;color:var(--ink-soft);font-style:italic;}
.item-desc{font-size:.78rem;color:var(--ink-soft);margin-top:3px;line-height:1.5;}
.item-foot{display:flex;align-items:center;justify-content:space-between;margin-top:8px;}
.item-price{font-weight:700;font-size:.9rem;}
.sold-badge{
  display:inline-block;font-size:.68rem;font-weight:700;color:var(--alert);
  background:var(--alert-bg);padding:3px 9px;border-radius:var(--r-pill);
}
.item-card.unavailable .item-emoji,.item-card.unavailable .item-name{opacity:.45;}
.item-card.unavailable .item-desc{opacity:.45;}

.stepper{display:flex;align-items:center;gap:10px;}
.stepper button{
  width:28px;height:28px;border-radius:50%;border:1px solid var(--line);background:var(--surface);
  color:var(--ink);font-size:1rem;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;
}
.qty-num{min-width:16px;text-align:center;font-weight:700;font-size:.85rem;}
.add-btn{
  background:var(--accent);color:var(--accent-ink);border:none;border-radius:var(--r-pill);
  width:32px;height:32px;font-size:1.15rem;cursor:pointer;display:flex;align-items:center;justify-content:center;
}

.cart-bar{
  position:absolute;left:14px;right:14px;bottom:14px;background:var(--surface-2);color:var(--surface-2-ink);
  border-radius:var(--r-lg);padding:13px 16px;display:flex;align-items:center;justify-content:space-between;
  box-shadow:var(--shadow-pop);cursor:pointer;border:none;width:calc(100% - 28px);
}
.cart-bar .count{background:var(--accent);color:var(--accent-ink);border-radius:var(--r-pill);
  padding:2px 9px;font-size:.72rem;font-weight:700;margin-right:8px;}
.cart-bar .cta{font-weight:700;font-size:.85rem;}

.sheet-head{
  display:flex;align-items:center;gap:10px;padding:var(--sp-4);border-bottom:1px solid var(--line);
  background:var(--surface);
}
.back-btn{background:none;border:none;font-size:1.2rem;cursor:pointer;color:var(--ink);padding:4px;}
.sheet-title{font-family:"Shippori Mincho B1",serif;font-size:1.1rem;}
.sheet-body{flex:1;overflow-y:auto;padding:var(--sp-4);}
.sheet-foot{padding:var(--sp-4);border-top:1px solid var(--line);}

.table-intro{font-size:.85rem;color:var(--ink-soft);line-height:1.6;margin-top:10px;}

.cart-row{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);align-items:flex-start;}
.cart-row:last-child{border-bottom:none;}
.cart-row .item-emoji{width:44px;height:44px;font-size:1.25rem;}
.cart-row-name{font-weight:700;font-size:.88rem;}
.cart-row-price{font-size:.78rem;color:var(--ink-soft);}
.trash-btn{background:none;border:none;color:var(--ink-soft);cursor:pointer;font-size:.9rem;padding:4px;}
.trash-btn:hover{color:var(--alert);}
.summary-line{display:flex;justify-content:space-between;font-size:.85rem;color:var(--ink-soft);padding:4px 0;}
.summary-total{display:flex;justify-content:space-between;font-weight:700;font-size:1.05rem;padding-top:8px;margin-top:6px;border-top:1px solid var(--line);}
.note-field{
  width:100%;border:1px solid var(--line);border-radius:var(--r-sm);padding:10px;font-size:.85rem;
  background:var(--surface);color:var(--ink);margin-top:var(--sp-2);resize:vertical;min-height:56px;
}
.primary-btn{
  width:100%;background:var(--accent);color:var(--accent-ink);border:none;border-radius:var(--r-md);
  padding:14px;font-size:.95rem;font-weight:700;cursor:pointer;
}
.primary-btn:disabled{opacity:.4;cursor:not-allowed;}
.ghost-btn{
  width:100%;background:none;border:1px solid var(--line);color:var(--ink);border-radius:var(--r-md);
  padding:12px;font-size:.88rem;font-weight:600;cursor:pointer;
}
.empty-note{text-align:center;color:var(--ink-soft);font-size:.85rem;padding:var(--sp-6) 0;}

.confirm-wrap{display:flex;flex-direction:column;align-items:center;text-align:center;padding:var(--sp-6) var(--sp-4);}
.confirm-check{
  width:64px;height:64px;border-radius:50%;background:var(--success-bg);color:var(--success);
  display:flex;align-items:center;justify-content:center;font-size:1.8rem;margin-bottom:var(--sp-4);
}
.status-pill{
  display:inline-flex;align-items:center;gap:6px;padding:6px 16px;border-radius:var(--r-pill);
  font-weight:700;font-size:.85rem;margin:var(--sp-3) 0;
}
.status-pill.st-received{background:var(--info-bg);color:var(--info);}
.status-pill.st-cooking{background:var(--cooking-bg);color:var(--accent);}
.status-pill.st-done{background:var(--success-bg);color:var(--success);}
.confirm-order-no{font-family:"Shippori Mincho B1",serif;font-size:1.35rem;margin-top:2px;}
.recap{width:100%;text-align:left;margin-top:var(--sp-5);border-top:1px solid var(--line);padding-top:var(--sp-4);}
.recap-row{display:flex;justify-content:space-between;font-size:.82rem;padding:4px 0;color:var(--ink-soft);}
</style>

      subtotal: "Subtotal",
      total: "Total",
      rateLimited: "Ordering has been temporarily limited due to a high number of recent orders. Please wait a moment and try again, or ask a staff member for help.",
      placeOrder: "Place Order",
      soldOut: "Sold Out Today",
      decreaseQty: "Decrease quantity",
      increaseQty: "Increase quantity",
      addToCart: "Add to cart",
      remove: "Remove",
      back: "Back",
      thankYou: "Thank you for your order",
      orderNo: function(id, table){ return "Order No. " + id + " (Table " + table + ")"; },
      statusNote: "This screen updates automatically",
      orderMore: "Order More",
      orderNotFound: "Order information not found.",
      backToMenu: "Back to Menu",
      langToggle: "日本語"
    }
  };
  function t(key){ return STR[state.lang === "en" ? "en" : "ja"][key]; }
  function itemName(item){ return (state.lang === "en" && item.name_en) ? item.name_en : item.name; }
  function itemDesc(item){ return (state.lang === "en" && item.name_en) ? (item.desc_en || "") : (item.desc || ""); }
  function categoryLabel(c){ return state.lang === "en" ? c.en : c.jp; }

  function loadState(){
    var fallback = {
      customerScreen:"menu",
      activeCategory:CATEGORIES[0].id,
      tableNumber:null,
      cart:[],
      note:"",
      menu:JSON.parse(JSON.stringify(DEFAULT_MENU)),
      orders:[],
      lastOrderId:null,
      orderBlocked:false,
      lang:"ja"
    };
    try{
      var raw = localStorage.getItem(STORAGE_KEY);
      if(!raw) return fallback;
      var parsed = JSON.parse(raw);
      if(!parsed || typeof parsed !== "object") return fallback;
      return Object.assign(fallback, parsed, {
        customerScreen: parsed.tableNumber ? (parsed.customerScreen||"menu") : "menu"
      });
    }catch(e){
      return fallback;
    }
  }

  // Each table's QR code encodes a random token, not a guessable sequential
  // number — visiting the bare page (or trying ?t=... with a made-up value)
  // does not grant a table. This is the bootstrap default only — once the
  // admin page rotates tokens (its "テーブルQR" tab), the active list lives
  // in shared storage under `tableTokens` and this array is only used the
  // very first time (or if storage is unavailable). It must stay identical
  // to DEFAULT_TABLE_TOKENS in the admin page.
  var DEFAULT_TABLE_TOKENS = [
    {number:1, token:"J9BVZY"}, {number:2, token:"EDU782"}, {number:3, token:"DD8GAX"},
    {number:4, token:"5ZVXUE"}, {number:5, token:"NLJW5L"}, {number:6, token:"QMULFC"},
    {number:7, token:"AUHB9F"}, {number:8, token:"Y3XKQG"}, {number:9, token:"LWR468"},
    {number:10, token:"3F6K59"}, {number:11, token:"GCHB26"}, {number:12, token:"2J4A75"}
  ];

  // A single order burst from one table (a leaked/reused token hit
  // repeatedly, or someone scripting the page) is throttled here — soft,
  // per-device protection, not a substitute for a real backend.
  var ORDER_RATE_LIMIT = 5;
  var ORDER_RATE_WINDOW_MS = 5 * 60 * 1000;

  function getActiveTokenMap(){
    var list = DEFAULT_TABLE_TOKENS;
    try{
      var raw = localStorage.getItem(STORAGE_KEY);
      if(raw){
        var parsed = JSON.parse(raw);
        if(parsed && Array.isArray(parsed.tableTokens) && parsed.tableTokens.length){
          list = parsed.tableTokens;
        }
      }
    }catch(e){ /* ignore */ }
    var map = {};
    list.forEach(function(t){ map[t.token] = t.number; });
    return map;
  }

  var state = loadState();

  // A valid QR token always wins over whatever table was remembered from a
  // previous visit on this device (a customer may sit at a different table).
  (function applyTableFromUrl(){
    try{
      var params = new URLSearchParams(window.location.search);
      var t = params.get("t");
      var tokens = getActiveTokenMap();
      if(t && Object.prototype.hasOwnProperty.call(tokens, t)){
        state.tableNumber = tokens[t];
        state.customerScreen = "menu";
      }
    }catch(e){ /* URLSearchParams unavailable — ignore */ }
  })();

  function persistFields(fields){
    try{
      var raw = localStorage.getItem(STORAGE_KEY);
      var current = {};
      if(raw){ try{ current = JSON.parse(raw) || {}; }catch(e){ current = {}; } }
      Object.assign(current, fields);
      localStorage.setItem(STORAGE_KEY, JSON.stringify(current));
    }catch(e){ /* storage unavailable — continue in memory */ }
  }

  // `orders` is written by both this page (new orders) and the separate
  // admin page (status changes). Always read the latest copy from storage
  // right before touching it, so a status change made in the admin tab is
  // never clobbered by a stale in-memory array from this tab.
  function readFreshOrders(){
    try{
      var raw = localStorage.getItem(STORAGE_KEY);
      if(raw){
        var parsed = JSON.parse(raw);
        if(parsed && Array.isArray(parsed.orders)) return parsed.orders;
      }
    }catch(e){ /* ignore */ }
    return state.orders.slice();
  }

  function persist(){
    persistFields({
      tableNumber: state.tableNumber,
      cart: state.cart,
      note: state.note,
      activeCategory: state.activeCategory,
      customerScreen: state.customerScreen,
      lastOrderId: state.lastOrderId,
      lang: state.lang
    });
  }

  function yen(n){ return "¥" + Number(n).toLocaleString("ja-JP"); }
  function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
  function findItem(id){ return state.menu.find(function(m){return m.id===id;}); }
  function cartCount(){ return state.cart.reduce(function(s,c){return s+c.qty;},0); }
  function cartTotal(){ return state.cart.reduce(function(s,c){ var it=findItem(c.itemId); return s + (it?it.price*c.qty:0); },0); }

  function render(){
    var inner;
    if(!state.tableNumber){
      inner = renderTableSelect();
    } else if(state.customerScreen === "cart"){
      inner = renderCart();
    } else if(state.customerScreen === "confirm"){
      inner = renderConfirm();
    } else {
      inner = renderMenu();
    }
    document.getElementById("page").innerHTML = '<div class="phone">' + inner + '</div>';
    persist();
  }

  function renderTableSelect(){
    return (
      '<div class="phone-head">' +
        '<div><div class="brand-name it-display">Soluchia</div><div class="brand-tag">'+esc(t("brandTag"))+'</div></div>' +
        '<button class="table-chip" data-action="toggle-lang">'+esc(t("langToggle"))+'</button>' +
      '</div>' +
      '<div class="sheet-body">' +
        '<h2 class="jp-display" style="font-size:1.15rem;">'+esc(t("gateTitle"))+'</h2>' +
        '<p class="table-intro">'+esc(t("gateBody1"))+'</p>' +
        '<p class="table-intro">'+esc(t("gateBody2"))+'</p>' +
      '</div>'
    );
  }

  function renderMenu(){
    var cats = CATEGORIES.filter(function(c){ return state.menu.some(function(m){return m.category===c.id;}); });
    var sections = cats.map(function(c){
      var items = state.menu.filter(function(m){ return m.category===c.id; });
      return (
        '<div class="cat-heading" id="cat-'+c.id+'">' +
          '<span class="jp jp-display">'+esc(categoryLabel(c))+'</span>' +
          '<span class="it it-display">'+esc(c.it)+'</span>' +
        '</div>' +
        items.map(renderItemCard).join('')
      );
    }).join('');

    var count = cartCount();
    return (
      '<div class="phone-head">' +
        '<div><div class="brand-name it-display">Soluchia</div><div class="brand-tag">'+esc(t("brandTag"))+'</div></div>' +
        '<div style="display:flex;flex-direction:column;gap:6px;align-items:flex-end;">' +
          '<button class="table-chip" data-action="change-table">'+esc(t("table")(state.tableNumber))+'</button>' +
          '<button class="table-chip" data-action="toggle-lang">'+esc(t("langToggle"))+'</button>' +
        '</div>' +
      '</div>' +
      '<div class="cat-row">' +
        cats.map(function(c){
          return '<button class="cat-pill'+(c.id===state.activeCategory?' active':'')+'" data-action="set-cat" data-id="'+c.id+'">'+esc(categoryLabel(c))+'</button>';
        }).join('') +
      '</div>' +
      '<div class="menu-scroll">' + sections + '</div>' +
      (count>0 ?
        '<button class="cart-bar" data-action="open-cart"><span><span class="count tabular">'+count+'</span>'+esc(t("addedToCart"))+'</span><span class="cta tabular">'+yen(cartTotal())+' '+esc(t("viewCart"))+'</span></button>'
        : '')
    );
  }

  function renderItemCard(item){
    var qtyInCart = state.cart.find(function(c){return c.itemId===item.id;});
    var qty = qtyInCart ? qtyInCart.qty : 0;
    var controls;
    if(!item.available){
      controls = '<span class="sold-badge">'+esc(t("soldOut"))+'</span>';
    } else if(qty>0){
      controls = '<div class="stepper">' +
        '<button data-action="dec" data-id="'+item.id+'" aria-label="'+esc(t("decreaseQty"))+'">−</button>' +
        '<span class="qty-num tabular">'+qty+'</span>' +
        '<button data-action="inc" data-id="'+item.id+'" aria-label="'+esc(t("increaseQty"))+'">+</button>' +
      '</div>';
    } else {
      controls = '<button class="add-btn" data-action="inc" data-id="'+item.id+'" aria-label="'+esc(t("addToCart"))+'">+</button>';
    }
    var desc = itemDesc(item);
    return (
      '<div class="item-card'+(item.available?'':' unavailable')+'">' +
        '<div class="item-emoji">'+item.emoji+'</div>' +
        '<div class="item-body">' +
          '<div class="item-name">'+esc(itemName(item))+'</div>' +
          '<div class="item-sub it-display">'+esc(item.sub)+'</div>' +
          (desc ? '<div class="item-desc">'+esc(desc)+'</div>' : '') +
          '<div class="item-foot"><span class="item-price tabular">'+yen(item.price)+'</span>'+controls+'</div>' +
        '</div>' +
      '</div>'
    );
  }

  function renderCart(){
    if(state.cart.length===0){
      return (
        '<div class="sheet-head"><button class="back-btn" data-action="back-to-menu" aria-label="'+esc(t("back"))+'">←</button><div class="sheet-title">'+esc(t("cartTitle"))+'</div></div>' +
        '<div class="sheet-body"><div class="empty-note">'+t("cartEmpty")+'</div></div>'
      );
    }
    var rows = state.cart.map(function(c){
      var it = findItem(c.itemId);
      if(!it) return '';
      return (
        '<div class="cart-row">' +
          '<div class="item-emoji">'+it.emoji+'</div>' +
          '<div class="item-body">' +
            '<div class="cart-row-name">'+esc(itemName(it))+'</div>' +
            '<div class="cart-row-price tabular">'+yen(it.price)+' × '+c.qty+' = '+yen(it.price*c.qty)+'</div>' +
            '<div class="stepper" style="margin-top:8px;">' +
              '<button data-action="dec" data-id="'+it.id+'">−</button>' +
              '<span class="qty-num tabular">'+c.qty+'</span>' +
              '<button data-action="inc" data-id="'+it.id+'">+</button>' +
            '</div>' +
          '</div>' +
          '<button class="trash-btn" data-action="remove" data-id="'+it.id+'" aria-label="'+esc(t("remove"))+'">🗑</button>' +
        '</div>'
      );
    }).join('');

    return (
      '<div class="sheet-head"><button class="back-btn" data-action="back-to-menu" aria-label="'+esc(t("back"))+'">←</button><div class="sheet-title">'+esc(t("cartTitle"))+'</div></div>' +
      '<div class="sheet-body">' +
        rows +
        '<label style="display:block;margin-top:var(--sp-4);font-size:.78rem;color:var(--ink-soft);">'+esc(t("noteLabel"))+'</label>' +
        '<textarea class="note-field" data-action="note" placeholder="'+esc(t("notePlaceholder"))+'">'+esc(state.note||'')+'</textarea>' +
        '<div class="summary-line" style="margin-top:var(--sp-4);"><span>'+esc(t("subtotal"))+'</span><span class="tabular">'+yen(cartTotal())+'</span></div>' +
        '<div class="summary-total"><span>'+esc(t("total"))+'</span><span class="tabular">'+yen(cartTotal())+'</span></div>' +
        (state.orderBlocked ?
          '<p style="font-size:.78rem;color:var(--alert);background:var(--alert-bg);border-radius:var(--r-sm);padding:10px 12px;margin-top:var(--sp-3);line-height:1.6;">'+esc(t("rateLimited"))+'</p>'
          : '') +
      '</div>' +
      '<div class="sheet-foot"><button class="primary-btn" data-action="place-order">'+esc(t("placeOrder"))+'</button></div>'
    );
  }

  function renderConfirm(){
    var order = state.orders.find(function(o){ return o.id===state.lastOrderId; });
    if(!order){
      return (
        '<div class="sheet-body"><div class="empty-note">'+esc(t("orderNotFound"))+'</div></div>' +
        '<div class="sheet-foot"><button class="ghost-btn" data-action="back-to-menu">'+esc(t("backToMenu"))+'</button></div>'
      );
    }
    var st = STATUS[order.status];
    var stLabel = state.lang === "en" ? st.label_en : st.label;
    var recap = order.items.map(function(i){
      return '<div class="recap-row"><span>'+esc(i.name)+' × '+i.qty+'</span><span class="tabular">'+yen(i.price*i.qty)+'</span></div>';
    }).join('');
    return (
      '<div class="sheet-body">' +
        '<div class="confirm-wrap">' +
          '<div class="confirm-check">✓</div>' +
          '<h2 class="jp-display" style="font-size:1.2rem;">'+esc(t("thankYou"))+'</h2>' +
          '<div class="confirm-order-no">'+esc(t("orderNo")(order.id, order.tableNumber))+'</div>' +
          '<div class="status-pill '+st.cls+'">● '+esc(stLabel)+'</div>' +
          '<p style="font-size:.8rem;color:var(--ink-soft);">'+esc(t("statusNote"))+'</p>' +
          '<div class="recap">' + recap +
            '<div class="recap-row" style="font-weight:700;color:var(--ink);border-top:1px solid var(--line);padding-top:8px;margin-top:4px;"><span>'+esc(t("total"))+'</span><span class="tabular">'+yen(order.total)+'</span></div>' +
          '</div>' +
        '</div>' +
      '</div>' +
      '<div class="sheet-foot"><button class="primary-btn" data-action="order-more">'+esc(t("orderMore"))+'</button></div>'
    );
  }

  function setCart(itemId, qty){
    var existing = state.cart.find(function(c){return c.itemId===itemId;});
    if(qty<=0){
      state.cart = state.cart.filter(function(c){return c.itemId!==itemId;});
    } else if(existing){
      existing.qty = qty;
    } else {
      state.cart.push({itemId:itemId, qty:qty});
    }
  }

  function placeOrder(){
    if(state.cart.length===0) return;
    var fresh = readFreshOrders();
    var recentFromThisTable = fresh.filter(function(o){
      return o.tableNumber === state.tableNumber && (Date.now() - o.createdAt) < ORDER_RATE_WINDOW_MS;
    }).length;
    if(recentFromThisTable >= ORDER_RATE_LIMIT){
      state.orderBlocked = true;
      render();
      return;
    }
    state.orderBlocked = false;
    var items = state.cart.map(function(c){
      var it = findItem(c.itemId);
      return {name:itemName(it), price:it.price, qty:c.qty};
    });
    var newId = fresh.reduce(function(m,o){ return Math.max(m, o.id); }, 0) + 1;
    var order = {
      id: newId,
      tableNumber: state.tableNumber,
      items: items,
      total: cartTotal(),
      note: state.note,
      status: "received",
      createdAt: Date.now()
    };
    fresh.unshift(order);
    state.orders = fresh;
    state.lastOrderId = newId;
    state.cart = [];
    state.note = "";
    state.customerScreen = "confirm";
    persistFields({orders: fresh});
  }

  function handleClick(e){
    var el = e.target.closest("[data-action]");
    if(!el) return;
    var action = el.getAttribute("data-action");
    var id = el.getAttribute("data-id");

    switch(action){
      case "change-table":
        state.tableNumber = null;
        break;
      case "toggle-lang":
        state.lang = state.lang === "en" ? "ja" : "en";
        break;
      case "set-cat":
        state.activeCategory = id;
        render();
        var target = document.getElementById("cat-"+id);
        if(target) target.scrollIntoView({behavior:"smooth", block:"start"});
        return;
      case "inc": {
        var item = findItem(id);
        if(!item || !item.available) return;
        var cur = state.cart.find(function(c){return c.itemId===id;});
        setCart(id, (cur?cur.qty:0)+1);
        break;
      }
      case "dec": {
        var cur2 = state.cart.find(function(c){return c.itemId===id;});
        setCart(id, (cur2?cur2.qty:0)-1);
        break;
      }
      case "remove": setCart(id, 0); break;
      case "open-cart": state.customerScreen="cart"; state.orderBlocked=false; break;
      case "back-to-menu": state.customerScreen="menu"; break;
      case "place-order": placeOrder(); break;
      case "order-more": state.customerScreen="menu"; break;
      default: return;
    }
    render();
  }

  function handleInput(e){
    var el = e.target;
    if(el.matches("[data-action='note']")){
      state.note = el.value;
      persist();
    }
  }

  document.getElementById("page").addEventListener("click", handleClick);
  document.getElementById("page").addEventListener("input", handleInput);

  render();

  // While the confirmation screen is showing, periodically pull the latest
  // order status from storage — the kitchen/staff update it from the
  // separate admin page.
  setInterval(function(){
    if(state.customerScreen === "confirm"){
      state.orders = readFreshOrders();
      render();
    }
  }, 3000);
})();
</script>
</body>
</html>
